name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1.12'
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - name: Instantiate
        run: |
          julia --project -e 'using Pkg; Pkg.instantiate()'
      - name: Run tests
        env:
          JULIA_TEST_COVERAGE: ${{ matrix.version == '1.12' && matrix.os == 'ubuntu-latest' }}
        run: |
          julia --project -e 'using Pkg; Pkg.test(coverage=get(ENV, "JULIA_TEST_COVERAGE", "false") == "true")'
      - name: Process coverage
        if: matrix.version == '1.12' && matrix.os == 'ubuntu-latest'
        uses: julia-actions/julia-processcoverage@v1
        with:
          directories: src
          lcov: true
      - name: Check Codecov token
        if: matrix.version == '1.12' && matrix.os == 'ubuntu-latest' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -z "$CODECOV_TOKEN" ]; then
            echo "::error::CODECOV_TOKEN is required for Codecov uploads on protected branches like main."
            exit 1
          fi
      - name: Upload to Codecov
        if: matrix.version == '1.12' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          files: ./lcov.info
          disable_search: true
          flags: unittests
          name: julia-1.12-ubuntu
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true

  mpi-test:
    runs-on: ubuntu-latest
    env:
      JULIA_MPI_BINARY: artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - name: Instantiate
        run: |
          julia --project -e 'using Pkg; Pkg.instantiate()'
      - name: Build MPI.jl
        run: |
          julia --project -e '
            using Pkg; Pkg.build("MPI");
            using MPI;
            try
              MPI.Init()
              println("MPI library version: ", MPI.Get_library_version())
            finally
              MPI.Finalize()
            end
          '
      - name: Install mpiexecjl wrapper
        run: |
          julia --project -e '
            using MPI
            MPI.install_mpiexecjl()
            println("Installed mpiexecjl in ", joinpath(homedir(), ".julia", "bin"))
          '
      - name: Run MPI sanity test (2 ranks)
        run: |
          julia --project -e '
            using MPI
            cmd = `$(MPI.mpiexec()) -n 2 $(Base.julia_cmd()) --project test/mpi_sanity.jl`
            println("Launching: ", cmd)
            run(cmd)
          '
      - name: Run MPI parallel correctness test (2 ranks)
        run: |
          julia --project -e '
            using MPI
            cmd = `$(MPI.mpiexec()) -n 2 $(Base.julia_cmd()) --project test/mpi_parallel_correctness.jl`
            println("Launching: ", cmd)
            run(cmd)
          '
